name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:secrets
      - run: npm run test:security
      - run: npm audit --omit=dev --audit-level=high
      - name: Build with synthetic public test configuration
        env:
          VITE_SUPABASE_URL: https://ci-example.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJyb2xlIjoiYW5vbiJ9.test
          VITE_TURNSTILE_SITE_KEY: ci-turnstile-site-key
        run: npm run build -- --outDir "$RUNNER_TEMP/astrea-build"
      - name: Scan browser assets for secrets
        run: node scripts/scanSecrets.js --dir "$RUNNER_TEMP/astrea-build"
